name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to check out; ordinary PR CI uses the merge commit.
        required: false
        default: ''
        type: string
      base_path:
        description: Absolute URL subpath for the static build and browser tests.
        required: false
        default: /open-vision-builder/
        type: string
      pages_subdirectory:
        description: Empty for main, or pr-N for the single active Pages preview.
        required: false
        default: ''
        type: string
      upload_pages:
        description: Also assemble and upload a GitHub Pages artifact.
        required: false
        default: false
        type: boolean
    outputs:
      source_commit:
        description: Commit checked out and verified by this run.
        value: ${{ jobs.verify.outputs.source_commit }}
      pages_artifact:
        description: Name of the Pages artifact from this build attempt.
        value: ${{ jobs.verify.outputs.pages_artifact }}

permissions:
  contents: read

jobs:
  verify:
    # Pages calls this same verifier for the trusted PR, so run it only once.
    if: >-
      inputs.upload_pages ||
      github.event_name != 'pull_request' ||
      github.repository != 'ttomohisa/open-vision-builder' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !contains(fromJSON('["feat/browser-classification-spike","feat/dfine-training-foundation"]'), github.event.pull_request.head.ref) ||
      github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      OVB_BASE: ${{ inputs.base_path || '/open-vision-builder/' }}
      CI: 'true'
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      pages_artifact: ${{ steps.source.outputs.pages_artifact }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record source and artifact identity
        id: source
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pages_artifact=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-models.txt
            scripts/requirements-detector.txt

      - name: Install JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply the exact-hash GridSample correction
        run: npm run prepare:deps

      - name: Install model preparation dependencies
        run: python -m pip install -r scripts/requirements-models.txt

      - name: Install the isolated detector reference environment
        run: |
          python -m venv artifacts/p1b/.venv-detector
          artifacts/p1b/.venv-detector/bin/python -m pip install -r scripts/requirements-detector.txt

      - name: Verify model preparation and Python parity helpers
        run: python -m unittest discover -s tests -p '*_test.py'

      - name: Prepare and verify the pinned public model
        run: python scripts/prepare_model.py

      - name: Verify the independent GridSample reference
        run: python scripts/generate_grid_sample_reference.py --check

      - name: Qualify D-FINE forward including all intermediate features
        id: detector_qualification
        # Preserve the strict nonzero G1 result, then collect bounded component
        # evidence. The following step rejects missing or invalid failure reports.
        continue-on-error: true
        run: >-
          artifacts/p1b/.venv-detector/bin/python scripts/prepare_detector.py
          --output-dir artifacts/p1b/detector-assets/prepared
          --diagnostic-dir artifacts/p1b/detector-assets/unqualified

      - name: Validate and prominently report the detector qualification outcome
        env:
          QUALIFICATION_OUTCOME: ${{ steps.detector_qualification.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          passed = os.environ['QUALIFICATION_OUTCOME'] == 'success'
          directory = Path('artifacts/p1b/detector-assets') / ('prepared' if passed else 'unqualified')
          report = json.loads((directory / 'preparation.json').read_text())
          manifest = json.loads((directory / 'model.json').read_text())
          assert report['passed'] is passed
          assert manifest['status'] == ('developer-investigation' if passed else 'unqualified-intermediate-parity-failure')
          assert report['source']['sha256'] == '19e06bdc873da819920a8d373b879721a5b9759d822f8213220bb09abbdab58b'
          assert [f['phase'] for f in report['fixtures']] == [0, 37, 91]
          all_results = []
          rows = []
          for fixture in report['fixtures']:
              comparisons = fixture['comparisons']
              assert set(comparisons) == {'logits', 'boxes', 'bboxInput', 'classInput', 'residualCorners', 'references'}
              for name in ('logits', 'boxes', 'references'):
                  assert comparisons[name]['passed'], f'Unexpected final-output/reference failure: {fixture["phase"]}/{name}'
              for name, value in comparisons.items():
                  assert isinstance(value['passed'], bool)
                  all_results.append(value['passed'])
                  rows.append(f'| {fixture["phase"]} | {name} | {"PASS" if value["passed"] else "FAIL"} |')
          assert all(all_results) is passed
          assert manifest['fixtures'] == report['fixtures']
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'OVB_DETECTOR_ASSETS={directory}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('## Detector G1 qualification: ' + ('PASS' if passed else 'FAIL — unresolved') + '\n\n')
              handle.write('The foundation checks below do not clear failed feature gates or establish detector readiness. Investigation assets are excluded from Pages.\n\n')
              handle.write('| Fixture phase | Tensor | Result |\n| --- | --- | --- |\n' + '\n'.join(rows) + '\n')
          PY

      - name: Measure the known rectangle without changing detector qualification
        run: >-
          artifacts/p1b/.venv-detector/bin/python -B scripts/reproduce_detector_rectangle.py
          --assets-dir "$OVB_DETECTOR_ASSETS"

      - name: Report the rectangle source parity separately from diagnostic completion
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('artifacts/p1c/rectangle-reproduction.json').read_text())
          names = ('logits', 'boxes', 'bboxInput', 'classInput', 'residualCorners', 'references')
          if (report['kind'] != 'dfine-rectangle-diagnostic-v1' or report['status'] != 'completed'
                  or report['qualifiesDetector'] is not False or set(report['comparisons']) != set(names)):
              raise SystemExit('Incomplete rectangle diagnostic')
          comparisons = report['comparisons']
          if any(type(comparisons[name]['passedAtOriginalBound']) is not bool for name in names):
              raise SystemExit('Invalid rectangle comparison result')
          passed = all(comparisons[name]['passedAtOriginalBound'] for name in names)
          if report['sourceParityPassed'] is not passed:
              raise SystemExit('Inconsistent rectangle parity result')
          decoder = report['decoder']
          stages = ('layer0', 'preBox', 'corner0', 'layer1', 'corner1', 'layer2')
          boundary_names = {f'layer{i}.{key}' for i in range(3) for key in (
              'hidden_states', 'position_embeddings', 'reference_points', 'encoder_hidden_states', 'output')}
          boundary_names.update(f'{head}.{side}' for head in ('preBox', 'corner0', 'corner1') for side in ('input', 'output'))
          if (set(decoder['boundaries']) != boundary_names or set(decoder['identicalOrtInput']) != set(stages)
                  or decoder['spatialShapes'] != [[40, 40], [20, 20]]
                  or type(decoder['queryOrder']['matchesConsumedEmbeddings']) is not bool
                  or report['instrumentationBitIdentical'] != dict.fromkeys(names[2:], True)):
              raise SystemExit('Incomplete decoder diagnostic')
          for group in ('boundaries', 'identicalOrtInput'):
              if any(type(value['passedAtOriginalBound']) is not bool for value in decoder[group].values()):
                  raise SystemExit('Invalid decoder comparison result')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write('## Known rectangle: diagnostic completed; source parity ' + ('PASS' if passed else 'FAIL') + '\n\n')
              handle.write('One known synthetic CPU input. This diagnostic does not qualify the detector, clear the original G1 gate, or establish browser/quality readiness.\n\n')
              handle.write('| Tensor | Result | Failed elements | Maximum tolerance ratio |\n| --- | --- | ---: | ---: |\n')
              for name in names:
                  row = comparisons[name]
                  label = 'PASS' if row['passedAtOriginalBound'] else 'FAIL'
                  handle.write(f'| {name} | {label} | {row["failedElements"]}/{row["elements"]} | {row["maxToleranceRatio"]:.6g} |\n')
              handle.write('\n### Decoder observations and original-module replay\n\n')
              handle.write('Own-input comparisons include upstream differences. Identical-ORT-input replay checks the local module on the observed operands; a local PASS does not clear source parity or establish quality.\n\n')
              handle.write('| Stage output | Own-input result / failures | Identical ORT input result / failures |\n| --- | --- | --- |\n')
              for name in stages:
                  own = decoder['boundaries'][name + '.output']
                  local = decoder['identicalOrtInput'][name]
                  own_label = 'PASS' if own['passedAtOriginalBound'] else 'FAIL'
                  local_label = 'PASS' if local['passedAtOriginalBound'] else 'FAIL'
                  handle.write(f'| {name} | {own_label} / {own["failedElements"]} | {local_label} / {local["failedElements"]} |\n')
              order = decoder['queryOrder']['matchesConsumedEmbeddings']
              handle.write(f'\nORT indices reproduce native consumed embedding order: {order}. No query realignment.\n')
          PY

      - name: Compare the pretrained final head and all parameter updates to PyTorch
        run: |
          artifacts/p1b/.venv-detector/bin/python scripts/generate_detector_training_reference.py --pretrained --cache-dir artifacts/p1b/detector-assets/source --output artifacts/p1b/training/pretrained-reference.json
          node scripts/verify_detector_training.mjs --reference artifacts/p1b/training/pretrained-reference.json --report artifacts/p1b/training/pretrained-js-verification.json

      - name: Build and typecheck
        run: npm run build

      - name: Record build metadata and require distributable assets
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('dist')
          if (root / 'models/dfine-nano').exists():
              raise SystemExit('Unqualified detector investigation assets must not be published')
          for relative in ('index.html', 'models/mobilenetv4-small/model.json',
                           'models/mobilenetv4-small/backbone.onnx'):
              if not (root / relative).is_file():
                  raise SystemExit(f'Missing distributable asset: {relative}')
          if not any((root / 'runtime').rglob('*.wasm')):
              raise SystemExit('Missing local WASM runtime assets')
          metadata = {
              'schemaVersion': 1,
              'commit': os.environ['SOURCE_COMMIT'],
              'pullRequest': int(os.environ['PR_NUMBER']) if os.environ['PR_NUMBER'] else None,
              'basePath': os.environ['OVB_BASE'],
              'workflowRun': (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
          }
          (root / 'build-info.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run unit tests
        run: npm test

      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify the browser training and full ONNX export
        run: npm run test:browser

      - name: Verify the browser export with Python ONNX Runtime CPU
        run: >-
          python scripts/predict.py
          --model artifacts/browser/model.onnx
          --verify-report artifacts/browser/report.json

      - name: Verify the bounded detector export with independent Python CPU inference
        run: >-
          python scripts/verify_detector.py
          --model artifacts/p1b/browser/model.onnx
          --report artifacts/p1b/browser/report.json
          --output artifacts/p1b/browser/python-verification.json

      - name: Save the verified static build, public model, and runtimes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-build-${{ steps.source.outputs.commit }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Assemble the Pages site
        if: inputs.upload_pages
        env:
          PREVIEW_DIRECTORY: ${{ inputs.pages_subdirectory }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          source = Path('dist')
          site = Path('_site')
          subdirectory = os.environ['PREVIEW_DIRECTORY']
          if subdirectory and not re.fullmatch(r'pr-[1-9][0-9]*', subdirectory):
              raise SystemExit('Invalid preview subdirectory')
          if site.exists():
              shutil.rmtree(site)
          target = site / subdirectory if subdirectory else site
          shutil.copytree(source, target)
          if subdirectory:
              metadata = json.loads((source / 'build-info.json').read_text(encoding='utf-8'))
              commit = html.escape(metadata['commit'])
              number = subdirectory.removeprefix('pr-')
              (site / 'index.html').write_text(
                  '<!doctype html><html lang="ja"><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  '<title>Open Vision Builder preview</title>'
                  '<h1>Open Vision Builder</h1>'
                  f'<p>PR #{number} / commit <code>{commit}</code></p>'
                  f'<p><a href="./{subdirectory}/">検証アプリを開く</a></p>'
                  '<p>公開中のプレビューは1件です。次の公開で置き換わります。</p>'
                  '</html>', encoding='utf-8')
              shutil.copy2(source / 'build-info.json', site / 'build-info.json')
          PY

      - name: Upload the verified Pages site
        if: inputs.upload_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.source.outputs.pages_artifact }}
          path: _site
          retention-days: 7

      - name: Save public-fixture evidence and browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.run_attempt }}
          path: |
            artifacts/browser/
            artifacts/p1b/grid-sample-browser.json
            artifacts/p1b/browser/
            artifacts/p1b/training/pretrained-js-verification.json
            artifacts/p1c/rectangle-reproduction.json
            artifacts/p1b/detector-assets/prepared/model.json
            artifacts/p1b/detector-assets/prepared/preparation.json
            artifacts/p1b/detector-assets/prepared/inventory.json
            artifacts/p1b/detector-assets/unqualified/model.json
            artifacts/p1b/detector-assets/unqualified/preparation.json
            artifacts/p1b/detector-assets/unqualified/inventory.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 7

      - name: Explain why deployment is disabled
        if: inputs.upload_pages && vars.PAGES_ENABLED != 'true'
        run: |
          echo 'Pages artifact is ready. Deployment is disabled until repository PAGES_ENABLED is true.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Complete the Pages and environment setup in docs/DEPLOYMENT.md, then re-run all jobs.' >> "$GITHUB_STEP_SUMMARY"

name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# There is one Pages site per repository. A successful run replaces its contents.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'ttomohisa/open-vision-builder' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'feat/browser-classification-spike'))
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      base_path: ${{ github.event_name == 'pull_request' && format('/open-vision-builder/pr-{0}/', github.event.pull_request.number) || '/open-vision-builder/' }}
      pages_subdirectory: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
      upload_pages: true

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Deploy the verified static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}

      - name: Record the deployment and source commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          echo "Deployed commit: ${SOURCE_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Check build-info.json at the site URL against this commit before sharing the preview.' >> "$GITHUB_STEP_SUMMARY"
